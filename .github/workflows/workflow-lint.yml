name: Workflow lint

# A workflow of its own: when ci.yml does not parse, GitHub runs none of its
# steps, and this one still reports why.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # actionlint 1.7.12, checked against its release checksum. It parses
      # every workflow and runs shellcheck (preinstalled on the runner) on
      # their run: scripts; shellcheck also checks .github/scripts.
      - name: actionlint and shellcheck
        run: |
          curl -sSfL --retry 3 -o actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color
          shellcheck .github/scripts/*.sh
