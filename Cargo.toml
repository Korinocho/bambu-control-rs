[package]
name = "bambu-control"
version = "1.0.0"
edition = "2024"
description = "Unofficial Windows desktop app to monitor and control Bambu Lab 3D printers over LAN"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/Korinocho/bambu-control-rs"
keywords = ["3d-printing", "bambulab", "mqtt", "gui", "lan"]
categories = ["gui"]
# Application, not a library: keep it off crates.io.
publish = false

[dependencies]
eframe = "0.35.0"
egui = "0.35.0"
rumqttc = { version = "0.25.1", features = ["use-native-tls"] }
native-tls = "0.2.18"
suppaftp = { version = "10.0.1", features = ["native-tls", "deprecated"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.3"
ureq = "3.3.0"
anyhow = "1.0.104"
crossbeam-channel = "0.5.16"
regex-lite = "0.1.9"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
