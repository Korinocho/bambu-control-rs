[package]
name = "bambu-control"
version = "1.0.0"
edition = "2024"
description = "Unofficial Windows desktop app to monitor and control Bambu Lab 3D printers over LAN"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/Korinocho/bambu-control-rs"
keywords = ["3d-printing", "bambulab", "mqtt", "gui", "lan"]
categories = ["gui"]
# Application, not a library: keep it off crates.io.
publish = false

[dependencies]
eframe = "0.35.0"
egui = "0.35.0"
# native-tls is used ONLY by MQTT (rumqttc) and the camera, until GitHub
# issues #1 and #2 move them to the printer certificate verifier. FTPS does
# not use it; this is not a transition step for FTPS.
native-tls = "0.2.18"
rumqttc = { version = "0.25.1", default-features = false, features = ["use-native-tls"] }
suppaftp = { version = "10.0.2", features = ["rustls-ring", "deprecated"] }
# "tls12" is load-bearing: the printers negotiate only TLS 1.2. Without it no
# printer handshake can succeed (design doc 5.3).
rustls = { version = "0.23.42", default-features = false, features = ["ring", "std", "tls12", "logging"] }
x509-cert = { version = "0.3.0", default-features = false }
ring = "0.17"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.3"
ureq = "3.3.0"
anyhow = "1.0.104"
crossbeam-channel = "0.5.16"
regex-lite = "0.1.9"

[build-dependencies]
winresource = "0.1"

# suppaftp 10.0.2 with one visibility patch: its TlsConnector trait is
# exported, so FTPS runs through the app's own connector (design doc 5.3).
# See vendor/suppaftp/PATCHES.md; drop this once upstream exports the trait.
[patch.crates-io]
suppaftp = { path = "vendor/suppaftp" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
